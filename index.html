<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoes Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
 
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-top">
      <a href="index.html" class="logo">Shoes Gallery</a>
 
      <div class="search-bar">
        <i data-lucide="search"></i>
        <span>Research a product</span>
      </div>
 
      <div class="header-actions">
        <a href="#">
          <span>Favorites</span>
          <i data-lucide="heart"></i>
        </a>
        <a href="#">
          <span>Cart</span>
          <i data-lucide="shopping-cart"></i>
        </a>
      </div>
    </div>
 
    <nav>
      <ul>
        <li><a href="#">Men</a></li>
        <li><a href="#">Women</a></li>
        <li><a href="#">Kids</a></li>
        <li><a href="#">Brands</a></li>
        <li><a href="#" class="active">Deals</a></li>
      </ul>
    </nav>
  </header>
 
 
  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main>
    <div class="page-header">
      <h2 class="section-title">All our shoes</h2>
      <!-- Rempli dynamiquement par script.js -->
      <span class="results-count" id="results-count">Loading...</span>
    </div>
 
    <div class="content">
 
      <!-- ===== SIDEBAR : Filtres ===== -->
      <aside class="filters">
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Sort by:</span>
            <i data-lucide="chevron-up"></i>
          </div>
          <div class="filter-options">
            <label><input type="radio" name="sort" value="price-asc" /> Price Low to High</label>
            <label><input type="radio" name="sort" value="price-desc" /> Price High to Low</label>
            <label><input type="radio" name="sort" value="name-asc" /> Product name A - Z</label>
            <label><input type="radio" name="sort" value="name-desc" /> Product name Z - A</label>
          </div>
        </div>
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Brands</span>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Gender</span>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Sizes</span>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Colour</span>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
 
        <div class="filter-group">
          <div class="filter-header" onclick="toggleFilter(this)">
            <span>Price</span>
            <i data-lucide="chevron-down"></i>
          </div>
        </div>
 
      </aside>
 
      <!-- Grille vide — remplie par script.js -->
      <section class="cards-grid" id="cards-grid"></section>
 
    </div>
  </main>
 
 
  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-inner">
      <div class="footer-col">
        <h3>Shoes Gallery</h3>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Newsletter</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Services</h3>
        <ul>
          <li><a href="#">Contact us</a></li>
          <li><a href="#">Size guide</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3>Shipping</h3>
      </div>
    </div>
  </footer>
 
 
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  <script src="script.js"></script>
 
</body>
</html>
